[package]
name = "linquo"
version = "0.1.0"
description = "Linquo - A language learning app"
authors = ["Logan-010"]
edition = "2024"
default-run = "linquo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "linquo_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
linquo-core = { workspace = true }
log = "0.4"
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"

[features]
# The Tauri CLI enables this for production builds. Nix enables it explicitly.
custom-protocol = ["tauri/custom-protocol"]
