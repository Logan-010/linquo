[package]
name = "linquo"
version = "0.1.0"
description = "Linquo - A language learning app"
authors = ["Logan-010"]
edition = "2024"
default-run = "linquo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "linquo_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
linquo-core = { workspace = true }
log = "0.4"
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1.53.3", default-features = false, features = ["fs", "sync"] }
color-eyre = "0.6"
hf-hub = { version = "1.0.0", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# Match the ONNX Runtime 1.27 API provided by the Nix environment.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-native", "copy-dylibs", "api-27"] }
ort-sys = "=2.0.0-rc.14"
ndarray = "0.17.2"
rand = "0.10.3"
rand_distr = "0.6.0"
unicode-normalization = "0.1"

[features]
# The Tauri CLI enables this for production builds. Nix enables it explicitly.
custom-protocol = ["tauri/custom-protocol"]
