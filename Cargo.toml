[workspace]
resolver = "3"
members = ["linquo-core", "linquo-app"]
default-members = ["linquo-app"]

[workspace.dependencies]
linquo-core = { path = "linquo-core" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
rpath = false
overflow-checks = false
