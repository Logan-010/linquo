[package]
name = "linquo-core"
version = "0.1.0"
edition = "2024"
description = "Linquo core library"
authors = ["Logan-010"]

[dependencies]
# Use the components directly: the facade's optional fastembed integration pins old ort.
rig-core = { version = "0.44.0", features = ["reqwest"] }
rig-agent = "0.44.0"
rust-embed = { version = "8.13.0", features = ["compression"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "macros", "migrate", "sqlite", "runtime-tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false, features = ["fs"] }
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt"] }
